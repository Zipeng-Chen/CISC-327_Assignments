# Workflow Name
name: Run Tests

# Trigger Events
on:
  push: # no value specifies default behaviour
  pull_request:
    branches:
    - main

# Tasks to Perform
jobs:
  test: # just a name. could be anyhting
    runs-on: ubuntu-latest # vm that github will use to do the job. apparently ubuntu is the standard

    steps:
      - name: checkout repository # step name
        uses: actions/checkout@v4 # existing github action. vm accesses repo

      - name: install python
        uses: actions/setup-python@v5 # installs python v3.12
        with:
          python-version: '3.12'

      - name: update pip
        run: python -m pip install --upgrade pip
      
      - name: install dependencies
        run: |
          python -m pip install -r requirements.txt # executes shell command. installs dependencies listed in `requirements.txt`
          python -m pip install pytest-cov==6.0.0
        working-directory: ./library-management

      - name: verify dependencies
        run: python -m pip show pytest-cov
        working-directory: ./library-management

      - name: Run existing tests with coverage
        working-directory: ./library-management
        run: python -m pytest tests --ignore=tests/e2e -v --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Install Chromium for Playwright
        working-directory: ./library-management
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests against Flask
        working-directory: ./library-management
        run: |
          python -m flask --app run:app run --port 5000 &
          flask_pid=$!
          trap 'kill "$flask_pid"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:5000/ui/books --output /dev/null
          python -m pytest tests/e2e -v
