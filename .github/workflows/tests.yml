# Workflow Name
name: Run Tests

# Trigger Events
on:
  push: # no value specifies default behaviour
  pull_request:
    branches:
    - main

# Tasks to Perform
jobs:
  test: # just a name. could be anyhting
    runs-on: ubuntu-latest # vm that github will use to do the job. apparently ubuntu is the standard

    steps:
      - name: checkout repository # step name
        uses: actions/checkout@v4 # existing github action. vm accesses repo

      - name: install python
        uses: actions/setup-python@v5 # installs python v3.12
        with:
          python-version: '3.12'

      - name: update pip
        run: python -m pip install --upgrade pip
      
      - name: install dependencies
        run: |
          python -m pip install -r requirements.txt # executes shell command. installs dependencies listed in `requirements.txt`
          python -m pip install pytest-cov=6.0.0
        working-directory: ./library-management

      - name: verify dependencies
        run: python -m pip show pytest-cov
        working-directory: ./library-management

      - name: run tests
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90 
        working-directory: ./library-management
